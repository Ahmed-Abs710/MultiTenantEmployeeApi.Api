version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: multi_tenant_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MultiTenantEmployeeDb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./MultiTenantEmployeeApi.Api/Dockerfile

    container_name: multi_tenant_api

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=MultiTenantEmployeeDb;Username=postgres;Password=postgres

volumes:
  postgres_data: